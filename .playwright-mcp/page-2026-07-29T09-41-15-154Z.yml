          - generic [ref=f27e135]: "zBD Agent — Decision Support Agent (Core). Layer AI đồng hành xuyên suốt toàn bộ sales journey — từ trước pitch đến sau pitch đến khi deal stall. Không chỉ tạo tài liệu — AI phân tích trạng thái deal và đề xuất \"bước tiếp theo nên làm gì, và vì sao\". Đây là điểm khác biệt cốt lõi của zBD Agent. Trigger khi BD nói: - \"nên làm gì tiếp theo với [KH]?\" - \"deal [KH] đang stuck\" - \"[KH] vừa gặp xong, họ nói...\" - \"paste meeting notes / email KH\" - Deal không update > 14 ngày (tự động phát hiện từ HubSpot nếu có) - \"phân tích deal [KH]\" - \"chuẩn bị gặp [KH] ngày mai\" Skill này cũng được tích hợp tự động vào cuối mỗi skill: zbd-research → Layer 1, zbd-matching → Layer 1+2, zbd-proposal → Layer 2+3"
