[project]
name = "zbd-agent-backend"
version = "0.1.0"
description = "ZB Business Development Agent — backend API for the ZB Webapp prototype"
requires-python = ">=3.12"

dependencies = [
    # web
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0",
    "sse-starlette>=2.1",
    # data
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "email-validator>=2.2",
    # infra clients
    "redis>=5.2",
    "arq>=0.26",
    "minio>=7.2",
    "httpx>=0.28",
    # auth
    "pyjwt>=2.10",
    # document generation
    "python-pptx>=1.0.2",
    "reportlab>=4.2",
    "pypdf>=5.1",
    # utils
    "orjson>=3.10",
    "tenacity>=9.0",
    "unidecode>=1.3",
    "structlog>=24.4",
    "pymupdf>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.14",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]  # B008: FastAPI Depends(); RUF00x: Vietnamese text

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
